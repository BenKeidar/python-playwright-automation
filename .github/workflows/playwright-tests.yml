
name: Python Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Tests - ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: |
          python -m pytest tests/ -v --browser ${{ matrix.browser }} --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore



  allure-report:
    name: Generate Allure Report
    needs: playwright-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        run: |
          curl -fsSL -o allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz

          tar -xzf allure.tgz

          echo "$GITHUB_WORKSPACE/allure-2.34.1/bin" >> "$GITHUB_PATH"

      - name: Generate Allure HTML report
        run: |
          allure generate allure-results \
            --clean \
            -o allure-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          if-no-files-found: warn
