name: Python Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Tests - ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: |
          python -m pytest tests/ -v -m "not visual" --browser ${{ matrix.browser }} --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore


  visual-tests:
    name: Visual Tests - Chromium
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run visual regression tests
        run: |
          python -m pytest tests/ -v -m visual --browser chromium --alluredir=allure-results

      - name: Upload visual test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-visual
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences
          path: test-results/
          if-no-files-found: ignore


  allure-report:
    name: Generate Allure Report
    needs: [playwright-tests, visual-tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        run: |
          curl -fsSL -o allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz

          tar -xzf allure.tgz

          echo "$GITHUB_WORKSPACE/allure-2.34.1/bin" >> "$GITHUB_PATH"

      - name: Add Allure environment information
        run: |
          echo "Environment=GitHub Actions" > allure-results/environment.properties
          echo "Operating.System=Ubuntu Linux" >> allure-results/environment.properties
          echo "Python.Version=3.13" >> allure-results/environment.properties
          echo "Browsers=Chromium, Firefox" >> allure-results/environment.properties
          echo "Test.Framework=Pytest + Playwright" >> allure-results/environment.properties

      - name: Add Allure executor information
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_url = (
              f"{os.environ['SERVER_URL']}/"
              f"{os.environ['REPOSITORY']}/actions/runs/"
              f"{os.environ['RUN_ID']}"
          )

          executor = {
              "name": "GitHub Actions",
              "type": "github",
              "buildName": f"Playwright CI #{os.environ['RUN_NUMBER']}",
              "buildUrl": run_url,
              "reportName": "Python Playwright Cross-Browser Tests",
          }

          Path("allure-results/executor.json").write_text(
              json.dumps(executor, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Generate Allure HTML report
        run: |
          allure generate allure-results \
            --clean \
            -o allure-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          if-no-files-found: warn
